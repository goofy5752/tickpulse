name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a PR run, but a run on main is never cancelled halfway through a deploy; the next one
  # waits for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOMAIN_LINE_MIN: 95
      OVERALL_LINE_MIN: 80
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore TickPulse.slnx
          dotnet tool restore

      - name: Format
        run: dotnet format TickPulse.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TickPulse.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TickPulse.slnx -c Release --no-build --collect "XPlat Code Coverage" --results-directory coverage

      - name: Coverage report
        run: |
          dotnet tool run reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage/report \
            -reporttypes:"MarkdownSummaryGithub;JsonSummary"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        run: |
          set -euo pipefail
          summary=coverage/report/Summary.json
          below() { awk -v a="$1" -v b="$2" 'BEGIN { exit !(a < b) }'; }
          fail=0

          overall_lines=$(jq -r '.summary.coverablelines // 0' "$summary")
          overall=$(jq -r '.summary.linecoverage // 0' "$summary")
          if [ "$overall_lines" -eq 0 ]; then
            echo "::error::No coverable lines were reported; coverage collection is broken."
            exit 1
          fi
          if below "$overall" "$OVERALL_LINE_MIN"; then
            echo "::error::Overall line coverage ${overall}% is below ${OVERALL_LINE_MIN}%."
            fail=1
          else
            echo "Overall line coverage ${overall}% (gate ${OVERALL_LINE_MIN}%)."
          fi

          domain_lines=$(jq -r '[.coverage.assemblies[] | select(.name == "TickPulse.Domain") | .coverablelines] | first // 0' "$summary")
          domain=$(jq -r '[.coverage.assemblies[] | select(.name == "TickPulse.Domain") | .coverage] | first // 0' "$summary")
          if [ "$domain_lines" -eq 0 ]; then
            echo "::error::TickPulse.Domain is missing from the coverage report or has no coverable lines."
            fail=1
          elif below "$domain" "$DOMAIN_LINE_MIN"; then
            echo "::error::TickPulse.Domain line coverage ${domain}% is below ${DOMAIN_LINE_MIN}%."
            fail=1
          else
            echo "TickPulse.Domain line coverage ${domain}% (gate ${DOMAIN_LINE_MIN}%)."
          fi

          {
            echo "### Coverage gate"
            echo "| Scope | Line coverage | Gate |"
            echo "|---|---:|---:|"
            echo "| Overall | ${overall}% | ${OVERALL_LINE_MIN}% |"
            if [ "$domain_lines" -eq 0 ]; then
              echo "| TickPulse.Domain | missing (fails) | ${DOMAIN_LINE_MIN}% |"
            else
              echo "| TickPulse.Domain | ${domain}% | ${DOMAIN_LINE_MIN}% |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$fail"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/report
          if-no-files-found: ignore
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Continuous delivery. On every push to main (and on a manual run) the api image goes to GHCR as :<sha>, and on
  # main also as :latest. The SSH deploy runs only when the variable DEPLOY_ENABLED is 'true' (on the repository or
  # the production environment, together with the DEPLOY_* secrets; see docs/deployment.md), so main stays green
  # before the server is set up. On the server, deploy/deploy.sh pulls, starts, waits for /health/ready, runs
  # deploy/smoke.sh, and rolls back to the last good tag when anything fails.
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://tickpulse.dev
    permissions:
      contents: read
      packages: write
    # One deploy at a time, across branches too (a manual run from a branch deploys that branch).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/goofy5752/tickpulse-api
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$GITHUB_SHA"
            # :latest follows main only; a manual run from another branch pushes just its sha.
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=tickpulse-api
            org.opencontainers.image.description=TickPulse API and dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Configure SSH
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::DEPLOY_ENABLED is 'true' but the secret $name is not set."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/tickpulse_deploy)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/tickpulse_known_hosts
          # Host-key checking stays strict: the server must match DEPLOY_KNOWN_HOSTS.
          cat > ~/.ssh/config <<EOF
          Host tickpulse-prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/tickpulse_deploy
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/tickpulse_known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy the deployment files
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          # Into a fresh staging directory; deploy.sh --install moves them into place.
          ssh tickpulse-prod 'rm -rf /srv/tickpulse/.incoming && mkdir -p /srv/tickpulse/.incoming'
          scp -rp deploy/docker-compose.prod.yml deploy/smoke.sh deploy/deploy.sh deploy/observability \
            tickpulse-prod:/srv/tickpulse/.incoming/

      - name: Deploy, smoke test, roll back on failure
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          # The sha expands here, on the runner, on purpose; deploy.sh accepts only [A-Za-z0-9._-].
          # shellcheck disable=SC2029
          ssh tickpulse-prod "bash /srv/tickpulse/.incoming/deploy.sh --install '$GITHUB_SHA'"

      - name: Remove the SSH key
        if: always() && vars.DEPLOY_ENABLED == 'true'
        run: rm -f ~/.ssh/tickpulse_deploy

      - name: Summary
        if: always()
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deploy"
            echo "- Image: \`$IMAGE:$GITHUB_SHA\`"
            if [ "$DEPLOY_ENABLED" = true ]; then
              echo "- SSH deploy: $JOB_STATUS (the step log shows the smoke test and any rollback)"
            else
              echo "- SSH deploy: skipped (DEPLOY_ENABLED is not 'true')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
