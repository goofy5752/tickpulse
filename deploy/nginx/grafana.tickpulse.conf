# grafana.tickpulse.dev: the TickPulse Grafana (anonymous Viewer access), behind Cloudflare.
# Installed as /etc/nginx/sites-available/grafana.tickpulse.dev, symlinked into sites-enabled/. Needs
# /etc/nginx/conf.d/tickpulse.conf (tickpulse-http.conf: the upgrade map, the client key and the
# tickpulse_grafana_query zone) and /etc/nginx/snippets/tickpulse-cloudflare-allow.conf. See docs/deployment.md.
#
# Upstream: the grafana container, published on 127.0.0.1:3005 by docker-compose.prod.yml.
# Written for nginx 1.18. The shared-host rules in tickpulse.conf apply here too: plain "listen 443 ssl" (no
# http2), and no default_server.

server {
    listen 80;
    server_name grafana.tickpulse.dev;

    return 301 https://grafana.tickpulse.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name grafana.tickpulse.dev;

    ssl_certificate     /etc/ssl/tickpulse/origin.pem;
    ssl_certificate_key /etc/ssl/tickpulse/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/tickpulse-cloudflare-allow.conf;

    # Viewers send queries and nothing else; the admin's dashboard JSON stays in the repository.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript text/javascript application/json image/svg+xml;

    access_log /var/log/nginx/grafana.tickpulse.access.log;
    error_log  /var/log/nginx/grafana.tickpulse.error.log warn;

    # 429 rather than nginx's default 503, so a throttled panel reads as "too many requests".
    limit_req_status 429;

    # Slow clients: headers and bodies must arrive promptly (Cloudflare sends whole requests). No per-visitor
    # connection limit: over HTTP/2 each request counts as one, and a dashboard load fetches dozens of files at once.
    client_header_timeout 10s;
    client_body_timeout   10s;
    server_tokens         off;

    # Datasource queries: one request per panel and refresh. 5 per second per visitor, with a burst that covers
    # loading the largest dashboard at once.
    location = /api/ds/query {
        limit_req zone=tickpulse_grafana_query burst=40 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }

    # The other query paths: the datasource proxy and resource calls (Loki label values, Tempo search).
    location ~ ^/api/datasources/(proxy|uid/[^/]+/resources)/ {
        limit_req zone=tickpulse_grafana_query burst=40 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }

    # Grafana Live (dashboard push updates): WebSockets.
    location /api/live/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $tickpulse_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
