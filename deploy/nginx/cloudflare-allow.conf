# Cloudflare's published edge ranges: only Cloudflare may talk to the TickPulse vhosts.
# Installed as /etc/nginx/snippets/tickpulse-cloudflare-allow.conf and included by both vhosts' 443 servers.
#
# Source: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 (also
# https://api.cloudflare.com/client/v4/ips). Last checked 2026-11-04. Cloudflare announces changes in advance;
# re-check them now and then and whenever Cloudflare announces a change:
#
#   diff <(grep -oE '[0-9a-f.:]+/[0-9]+' cloudflare-allow.conf) \
#        <(curl -s https://www.cloudflare.com/ips-v4; echo; curl -s https://www.cloudflare.com/ips-v6)
#
# This list must see Cloudflare's own address in $remote_addr. A host may trust Cloudflare's ranges at the http level
# (set_real_ip_from + real_ip_header CF-Connecting-IP, for its other sites); then the realip module would replace
# $remote_addr with the visitor's address before this list is checked, and every visitor would be denied. A
# set_real_ip_from in a server block replaces the inherited list, so the one below makes the TickPulse vhosts trust
# no proxy but loopback: $remote_addr stays the Cloudflare peer here. The visitor's address still reaches the api in
# CF-Connecting-IP, and the rate limits key on that header (tickpulse-http.conf).
set_real_ip_from 127.0.0.1/32;

# IPv4
allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;

# IPv6
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

deny all;
