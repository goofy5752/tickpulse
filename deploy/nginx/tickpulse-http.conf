# http-level definitions for the TickPulse vhosts. They cannot live in a server block.
# Installed as /etc/nginx/conf.d/tickpulse.conf (nginx.conf includes conf.d/*.conf inside http {}).
#
# Every name starts with "tickpulse" so it cannot clash with the definitions of other sites on the same nginx.

# WebSocket upgrades (SignalR /hubs/ on tickpulse.dev, Grafana Live /api/live/ on grafana.tickpulse.dev):
# "upgrade" when the client asks for one, otherwise an empty Connection header, which keeps the upstream
# connection reusable.
map $http_upgrade $tickpulse_connection_upgrade {
    default upgrade;
    ''      '';
}

# The visitor behind Cloudflare. The vhosts admit only Cloudflare's ranges, so the header is Cloudflare's own;
# without it (a request that will be denied anyway) the peer address is used.
map $http_cf_connecting_ip $tickpulse_client {
    default $http_cf_connecting_ip;
    ''      $binary_remote_addr;
}

# Grafana query endpoints, per visitor. Anonymous viewers can send their own queries to /api/ds/query, so this
# bounds how fast anyone can spend the per-query budgets of Prometheus, Loki and Tempo
# (deploy/observability/README.md). A dashboard load sends one request per panel, hence the burst.
# The limit is checked before allow/deny, so a direct (non-Cloudflare) client could spend another visitor's
# bucket by forging CF-Connecting-IP; it still gets no data, only 403s.
limit_req_zone $tickpulse_client zone=tickpulse_grafana_query:10m rate=5r/s;

# The api paths that its own rate limiter does not cover, per visitor: the health checks (/health/ready opens a
# database connection on every hit), the API reference (/docs) and the OpenAPI document. Generous for people,
# uptime monitors and the Scalar page's assets (hence the burst in tickpulse.conf); a flood stops at nginx. The same
# CF-Connecting-IP caveat as above applies.
limit_req_zone $tickpulse_client zone=tickpulse_api_unmetered:10m rate=10r/s;
