# tickpulse.dev: the TickPulse API and dashboard, behind Cloudflare (proxied, SSL mode Full (strict)).
# Installed as /etc/nginx/sites-available/tickpulse.dev, symlinked into sites-enabled/. Needs
# /etc/nginx/conf.d/tickpulse.conf (tickpulse-http.conf) and
# /etc/nginx/snippets/tickpulse-cloudflare-allow.conf (cloudflare-allow.conf). See docs/deployment.md.
#
# Upstream: the api container, published on 127.0.0.1:8085 by docker-compose.prod.yml.
# Written for nginx 1.18, with gzip but no brotli.
#
# Shared-host rules:
#   - Plain "listen 443 ssl", without http2. On 1.18, "http2" is a property of the listening socket, so it would
#     switch HTTP/2 on for every site on 443. Visitors still get HTTP/2 (and HTTP/3) from Cloudflare; only the
#     Cloudflare-to-origin hop is HTTP/1.1.
#   - No default_server. nginx then treats the FIRST server block it loads for an address:port as that port's
#     default, which answers requests for unknown names and decides socket-wide settings such as ssl_protocols.
#     conf.d/ and sites-enabled/ load in alphabetical order, so the host must keep an explicit default_server
#     on 80 and 443 (`nginx -T | grep default_server`); otherwise this vhost may become the default by accident.
# Only this server_name is served here.

server {
    listen 80;
    server_name tickpulse.dev;

    # return runs before allow/deny, so this answers anyone, and reveals nothing but the redirect.
    return 301 https://tickpulse.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name tickpulse.dev;

    # Cloudflare Origin certificate for tickpulse.dev and *.tickpulse.dev (root-only files).
    ssl_certificate     /etc/ssl/tickpulse/origin.pem;
    ssl_certificate_key /etc/ssl/tickpulse/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/tickpulse-cloudflare-allow.conf;

    # The only request bodies are the admin calls' small JSON documents.
    client_max_body_size 1m;

    # HSTS for the domain and its subdomains (grafana.tickpulse.dev). The API sets its own nosniff, referrer and
    # frame headers; any Content-Security-Policy is the API's to set. No add_header below this level, or nginx
    # would drop this one there.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript text/javascript application/json application/xml
                      application/problem+json application/problem+xml image/svg+xml application/manifest+json;

    access_log /var/log/nginx/tickpulse.access.log;
    error_log  /var/log/nginx/tickpulse.error.log warn;

    # 429 rather than nginx's default 503, like the api's own rate limiter.
    limit_req_status 429;

    # SignalR (live prices): WebSockets, with long-lived connections. SignalR pings every 15 s.
    location /hubs/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $tickpulse_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Health checks, API reference and OpenAPI document: the api does not rate-limit these itself, so nginx does
    # (tickpulse_api_unmetered in tickpulse-http.conf: 10 per second per visitor, burst 20). deploy.sh and its
    # smoke test reach the api on 127.0.0.1:8085 directly, so they are not limited. Case-insensitive (~*), because
    # ASP.NET Core routing is: /HEALTH/ready and /Docs reach the same endpoints.
    location ~*^/(health|docs|openapi)(/|$) {
        limit_req zone=tickpulse_api_unmetered burst=20 nodelay;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        # The API takes the scheme from X-Forwarded-Proto and the client IP from CF-Connecting-IP, from trusted
        # peers only (ForwardedHeaders__KnownNetworks). Only Cloudflare reaches this point (allow/deny above).
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
