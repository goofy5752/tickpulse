# TickPulse alert rules. Each rule is a Prometheus instant query (A) plus a threshold (C).
# Grafana expands environment variables in provisioning files, so templates use .Labels/.Values
# instead of the $labels/$values aliases.
apiVersion: 1

groups:
  - orgId: 1
    name: Ingestion
    folder: TickPulse
    interval: 10s
    rules:
      - uid: tp-ws-disconnected
        title: WebSocket disconnected
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3900, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              # How long the API has been reporting without any instance reporting Connected
              # (WsState 2): the timestamp of the newest tickpulse_ws_state sample minus the timestamp
              # of the newest Connected one. Both come from the samples themselves, so the rule
              # measures what the API reported, not how late the report arrived: when the telemetry
              # pipeline is slow or stalled under load, both timestamps stop together and the
              # difference stays at 0, so the rule stays quiet. Missing or delayed metrics are the
              # "Telemetry pipeline down" rule's business; that rule also covers an API that is down
              # entirely, until the planned external uptime check on /health/ready exists (see
              # docs/deployment.md, "Uptime check").
              # Cold start: with no Connected sample in the last hour, the newest Connected time is
              # taken as the API's first ws_state sample plus 60 s, so a fresh start gets 2 minutes to
              # connect before the condition is true.
              expr: >-
                max(max_over_time(timestamp(tickpulse_ws_state{service_name="tickpulse-api"})[1h:15s]))
                - (
                max(max_over_time((timestamp(tickpulse_ws_state{service_name="tickpulse-api"}) and tickpulse_ws_state{service_name="tickpulse-api"} == 2)[1h:15s]))
                or
                (min(min_over_time(timestamp(tickpulse_ws_state{service_name="tickpulse-api"})[1h:15s])) + 60)
                )
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [60] }
        # 30 s pending period: rides out a short reconnect. Detection takes about 90-110 s.
        for: 30s
        # No ws_state sample in the last hour, or Prometheus failing to answer, is a telemetry
        # problem, not evidence of a disconnect: stay quiet and let "Telemetry pipeline down" report it.
        noDataState: OK
        execErrState: KeepLast
        labels:
          severity: critical
          component: ingestion
        annotations:
          summary: The Binance WebSocket has not been connected for more than 90 seconds.
          description: The API keeps reporting, but no TickPulse instance reports a Connected stream, so no trades are being ingested. Check the API logs for connection errors.
          __dashboardUid__: tp-ingestion
          __panelId__: "19"

      - uid: tp-telemetry-stale
        title: Telemetry pipeline down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              # Seconds since the newest API metric sample (tickpulse_ws_state, exported every 15 s).
              # It grows when the API stops exporting, or when the collector, Prometheus or the
              # network between them refuses or delays the data.
              expr: time() - max(timestamp(tickpulse_ws_state{service_name="tickpulse-api"}))
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [120] }
        for: 1m
        # No API metric within Prometheus' 5-minute lookback, or Prometheus failing to answer, is
        # exactly what this rule reports.
        # Critical while it is the only alert for an API that is down entirely: the external uptime
        # check on /health/ready is planned (docs/deployment.md, "Uptime check") but not in place yet.
        # Lower it to warning once that check exists.
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          component: telemetry
        annotations:
          summary: 'The newest API metric is {{ with .Values.A }}{{ humanizeDuration .Value }}{{ else }}more than 5 minutes{{ end }} old.'
          description: Metrics from the API are not reaching Prometheus, so the dashboards are stale and the ingestion alerts cannot see a problem. Check that the API is up, then the collector's health and the Telemetry pipeline row of the Runtime/DB dashboard (refused or failed data).
          __dashboardUid__: tp-runtime
          __panelId__: "26"

      - uid: tp-ingest-lag-p95
        title: Ingest lag p95 above 5 s
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le) (rate(tickpulse_ingest_lag_milliseconds_bucket{service_name="tickpulse-api"}[5m])))
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5000] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: 'Ingest lag p95 is {{ with .Values.A }}{{ humanize .Value }}{{ end }} ms (threshold 5000 ms).'
          description: Trades take longer than 5 s from Binance trade time to the database. Look at channel depth and flush duration on the Ingestion dashboard.
          __dashboardUid__: tp-ingestion
          __panelId__: "13"

      - uid: tp-zero-ticks
        title: No ticks for an active symbol
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              # Ticks in the last minute for every symbol the API reports as active
              # (tickpulse_ingest_symbol_active == 1). An active symbol that has never received a
              # tick counts as 0. Removed symbols drop out of the gate immediately; when the API
              # stops exporting, the gate empties within 45 s and the WebSocket alert takes over.
              expr: >-
                (
                sum by (symbol) (increase(tickpulse_ingest_ticks_received_total{service_name="tickpulse-api"}[1m]))
                or on (symbol)
                0 * max by (symbol) (last_over_time(tickpulse_ingest_symbol_active{service_name="tickpulse-api"}[45s]))
                )
                and on (symbol)
                (max by (symbol) (last_over_time(tickpulse_ingest_symbol_active{service_name="tickpulse-api"}[45s])) == 1)
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.5] }
        # 5 m pending: a newly added, illiquid symbol may legitimately go a few minutes without trades.
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: '{{ .Labels.symbol }} has received no ticks for 6 minutes.'
          description: The symbol is subscribed but no aggTrade messages arrived. Check the WebSocket state and the symbol's trading status on Binance.
          __dashboardUid__: tp-ingestion
          __panelId__: "9"

  - orgId: 1
    name: API
    folder: TickPulse
    interval: 30s
    rules:
      - uid: tp-api-5xx-ratio
        title: API 5xx ratio above 2 %
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              # Only with real traffic (> 0.1 req/s): a single 500 among a handful of requests is not an outage.
              # The SignalR hub (long-lived connections) and the health probes (503 while ingestion
              # connects, which is expected) are not API traffic and are left out.
              expr: >-
                (
                sum(rate(http_server_request_duration_seconds_count{service_name="tickpulse-api", http_route!~"/?(hubs|health)/.*", http_response_status_code=~"5.."}[5m]))
                / sum(rate(http_server_request_duration_seconds_count{service_name="tickpulse-api", http_route!~"/?(hubs|health)/.*"}[5m]))
                )
                and
                sum(rate(http_server_request_duration_seconds_count{service_name="tickpulse-api", http_route!~"/?(hubs|health)/.*"}[5m])) > 0.1
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.02] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          component: api
        annotations:
          summary: '{{ with .Values.A }}{{ humanizePercentage .Value }}{{ end }} of API requests fail with 5xx (threshold 2 %).'
          description: Server errors over the last 5 minutes. The API dashboard shows the affected routes; failed requests link to their traces.
          __dashboardUid__: tp-api
          __panelId__: "10"
