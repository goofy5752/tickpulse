# Loki: single-binary, filesystem storage, logs ingested over native OTLP (/otlp/v1/logs).
# Retention: 14 days, enforced by the compactor.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  # A full OTLP batch from the collector is at most about 1 MiB; leave room above gRPC's 4 MiB default.
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h
  # OTLP log attributes (trace_id, span_id, severity, symbol, ...) are stored as structured metadata.
  allow_structured_metadata: true
  discover_log_levels: true
  volume_enabled: true
  max_query_lookback: 336h
  # One service writes here, as a single stream (service_name). The API samples its request log, so
  # normal traffic stays far below these; they bound a burst of errors without refusing it at once.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
  # Grafana is publicly viewable, so bound what any single query may cost.
  max_query_parallelism: 4
  max_query_length: 14d
  max_entries_limit_per_query: 1000
  query_timeout: 30s
  # No log deletion through the API; retention is the only way data leaves Loki.
  deletion_mode: disabled

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

pattern_ingester:
  enabled: false

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
