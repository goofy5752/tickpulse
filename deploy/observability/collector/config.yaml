# OpenTelemetry Collector: the single OTLP entry point for TickPulse telemetry.
#
#   traces  -> Tempo       (OTLP/gRPC)
#   metrics -> Prometheus  (remote write)
#   logs    -> Loki        (native OTLP endpoint)
#
# Under overload the collector sheds traces and logs first and keeps metrics, which the alerts depend on:
#   - traces and logs pass memory_limiter/bulk, which starts refusing at a lower heap size than
#     memory_limiter/metrics, so metrics still get through while traces and logs are refused;
#   - every exporter has a bounded sending queue and a short retry window, so a slow or rate-limited
#     backend (Loki answering 429) makes the collector drop data after a few seconds instead of
#     holding it in memory for minutes.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Container limit 128 MiB, GOMEMLIMIT 100 MiB. Each limiter refuses new data once the Go heap
  # passes limit_mib - spike_limit_mib (soft limit) and forces a GC at limit_mib (hard limit).
  # Traces and logs: soft limit 56 MiB.
  memory_limiter/bulk:
    check_interval: 1s
    limit_mib: 72
    spike_limit_mib: 16
  # Metrics (a few hundred points every 15 s): soft limit 84 MiB, refused last.
  memory_limiter/metrics:
    check_interval: 1s
    limit_mib: 90
    spike_limit_mib: 6

  # Keep only the resource attributes that are useful as Prometheus labels. Every resource
  # attribute becomes a label on every series, so SDK/process attributes would only add noise.
  transform/metric_resource:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "service.instance.id", "deployment.environment", "deployment.environment.name"])

  # Defence in depth: never store client addresses, HTTP headers, user agents or query strings,
  # even if an instrumentation library starts emitting them. The logs and traces are publicly viewable.
  attributes/scrub:
    actions:
      - key: client.address
        action: delete
      - key: network.peer.address
        action: delete
      - key: user_agent.original
        action: delete
      - key: url.query
        action: delete
      - key: url.full
        action: delete
      - key: url.original
        action: delete
      - key: http.url
        action: delete
      - pattern: ^http\.request\.header\..+
        action: delete
      - pattern: ^http\.response\.header\..+
        action: delete

  # Batches stay well below the backends' 4 MiB gRPC message limit (a request log record is about 1 KB).
  batch/traces:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 2s
  batch/logs:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 2s
  batch/metrics:
    send_batch_size: 2048
    send_batch_max_size: 4096
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    # At most 50 batches waiting; beyond that new batches are dropped, never buffered.
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 50
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s

  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    # Resource attributes become labels, e.g. service.name -> service_name="tickpulse-api".
    resource_to_telemetry_conversion:
      enabled: true
    # Default OTel -> Prometheus naming: counters get _total, units become suffixes (_seconds, _milliseconds, _bytes).
    add_metric_suffixes: true
    timeout: 10s
    remote_write_queue:
      enabled: true
      queue_size: 2000
    # Metrics are small and the alerts read them: retry for longer than traces and logs. Prometheus
    # accepts samples up to 5 minutes out of order (out_of_order_time_window).
    retry_on_failure:
      enabled: true
      max_elapsed_time: 5m

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 50
    # Loki answers 429 when its ingestion limit is reached; retrying for minutes would only pile
    # up memory, so give up after 30 s and drop the batch.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter/bulk, attributes/scrub, batch/traces]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter/metrics, transform/metric_resource, batch/metrics]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [memory_limiter/bulk, attributes/scrub, batch/logs]
      exporters: [otlp_http/loki]
