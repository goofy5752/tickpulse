# Tempo 3: single binary (-target=all), local block storage, OTLP in from the collector.
# Retention: 14 days (336h) of trace blocks.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Grafana is publicly viewable, so bound what any single query may cost.
query_frontend:
  api_timeout: 30s
  max_outstanding_per_tenant: 200
  search:
    default_result_limit: 20
    max_result_limit: 200
    max_duration: 168h

querier:
  max_concurrent_queries: 8
  search:
    query_timeout: 30s

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 336h

backend_worker:
  compaction:
    block_retention: 336h
  # On SIGTERM the worker waits this long for its current job, even when it has none (default 30 s, the whole
  # stop_grace_period, so Compose killed Tempo). Compaction jobs are retried, so a shorter wait loses nothing.
  finish_on_shutdown_timeout: 10s

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 336h

usage_report:
  reporting_enabled: false
